<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graphlite · Testmateriaal</title>
<style>body{font:15px system-ui;margin:0;color:#17202a;background:#f4f6f8}header{padding:14px 20px;background:#17202a;color:white;display:flex;gap:16px;align-items:center}header a{color:white}main{display:grid;grid-template-columns:minmax(420px,1.3fr) minmax(320px,1fr);gap:14px;padding:14px}.card{background:white;border:1px solid #ccd3da;border-radius:8px;padding:12px}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #e4e8ec;text-align:left}tr{cursor:pointer}tr:hover{background:#eef5ff}.OK{color:#087a3d;font-weight:700}label{display:block;margin:9px 0 4px}input,select,textarea{box-sizing:border-box;width:100%;padding:7px}textarea{min-height:82px}button{padding:8px 13px;margin-top:10px}.filters{display:flex;gap:8px;margin-bottom:10px}.bulk-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px;padding:8px;background:#eef3f7;border-radius:6px}.bulk-actions select{width:auto}.bulk-actions label{display:flex;align-items:center;gap:5px;margin:0}.bulk-actions input,.row-select{width:auto}.bulk-actions button{margin:0}.filters>*{width:auto}.note{font-size:13px;color:#59636e}@media(max-width:850px){main{grid-template-columns:1fr}}</style></head>
<body><header><strong>Testmateriaal · DB-schema 2</strong><a href="index.html">Terug naar Graphlite</a><span id="count"></span></header><main><section class="card"><div class="filters"><select id="statusFilter"><option value="">Alle statussen</option></select><select id="categoryFilter"><option value="">Alle categorieën</option></select><input id="search" placeholder="Zoeken"></div><div class="bulk-actions"><label><input id="selectVisible" type="checkbox"> Alles zichtbaar</label><span id="selectedCount">0 geselecteerd</span><select id="bulkStatus" aria-label="Nieuwe status"></select><button id="applyBulkStatus" type="button" disabled>Status toepassen</button><span id="bulkMessage" class="note"></span></div><table><thead><tr><th>Selectie</th><th>Nr.</th><th>Input</th><th>Categorie</th><th>Status</th><th>Analyse</th></tr></thead><tbody id="rows"></tbody></table></section><section class="card"><h2 id="heading">Kies een input</h2><form id="editor" hidden><label>Oorspronkelijke input</label><textarea id="original_input"></textarea><label>Categorie</label><select id="category_code"></select><p class="note" id="decision_rule"></p><label>Volgorde</label><input id="sort_order" type="number"><label>Publicatiestatus</label><select id="status"></select><label>Analysestatus</label><select id="analysis_status"><option>VOORSTEL</option><option>GOEDGEKEURD</option><option>AMBIGU</option><option>ONVOLLEDIG</option></select><label>Vorm</label><select id="form"><option>simplex</option><option>bijzin</option><option>vraagzin</option><option>complex</option><option>story</option></select><label>Voltooiing</label><select id="completion"><option>AF</option><option>ONAF</option></select><label>Kernzinnen — één per regel</label><textarea id="kernels"></textarea><label>Geanalyseerde relaties</label><div class="note" id="relations"></div><label>Kenmerken (komma’s)</label><input id="features"><label>Publicatiefase (leeg = nog niet ingepland)</label><input id="publication_phase" type="number"><label>Platforms (komma’s)</label><input id="platforms"><label>Interne notitie</label><textarea id="internal_note"></textarea><p class="note">Inhoudelijke wijziging zet de analyse terug naar VOORSTEL en een bestaand OK-item automatisch naar TEST, tenzij je bewust opnieuw OK kiest.</p><button type="submit">Opslaan</button> <span id="message"></span></form></section></main><script src="testmateriaal.js"></script></body></html>
