<!doctype html>
<html lang="nl" data-version="v4505">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>OpenGraph Lite Viewer v4505 · reset cache</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:24px;line-height:1.55;background:#f8fafc;color:#0f172a}
    main{max-width:860px;margin:auto;background:#fff;border:1px solid #cbd5e1;border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
    pre{white-space:pre-wrap;background:#f1f5f9;padding:12px;border-radius:12px}.button{display:inline-block;margin:8px 8px 0 0;padding:10px 14px;border-radius:10px;border:1px solid #94a3b8;background:#fff;color:#0f172a;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
<main>
  <h1>OpenGraph Lite Viewer v4505 · reset cache</h1>
  <p>Deze pagina verwijdert oude service workers en browsercaches voor deze origin. Daarna opent hij de viewer-root.</p>
  <pre id="log">Start reset...</pre>
  <p>
    <a class="button" href="index.html?v4505&fresh=1">Open / index.html</a>
    <a class="button" href="viewer.html?v4505&fresh=1">Open viewer.html</a>
    <a class="button" href="debug.html?v4505">Debug</a>
    <a class="button" href="carrousel/index.html?v4505">Carrousel</a>
  </p>
</main>
<script>
(async function(){
  const lines=[];
  const log=document.getElementById('log');
  const add=m=>{lines.push(m); log.textContent=lines.join('\n');};
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      add('Service workers gevonden: '+regs.length);
      for (const reg of regs) { await reg.unregister(); add('Unregistered: '+(reg.scope||'(scope onbekend)')); }
    } else add('Geen serviceWorker API.');
  } catch(e) { add('Service worker reset fout: '+e.message); }
  try {
    if ('caches' in window) {
      const keys = await caches.keys();
      add('Caches gevonden: '+keys.length);
      for (const key of keys) { await caches.delete(key); add('Cache verwijderd: '+key); }
    } else add('Geen Cache API.');
  } catch(e) { add('Cache reset fout: '+e.message); }
  add('Klaar. Viewer wordt geopend...');
  setTimeout(()=>location.replace('index.html?v4505&fresh=' + Date.now()), 900);
})();
</script>
</body>
</html>
