<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenGraph reset cache v2.0.0-rc.26</title>
  <style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:2rem;line-height:1.45;color:#0f172a}code{background:#f1f5f9;padding:.1rem .25rem;border-radius:.3rem}.log{border:1px solid #cbd5e1;border-radius:.8rem;padding:1rem;background:#f8fafc;white-space:pre-wrap}</style>
</head>
<body>
  <h1>OpenGraph cache-reset v2.0.0-rc.26</h1>
  <p>Deze pagina verwijdert oude service-workers en browsercaches voor deze origin en opent daarna de viewer met een cache-bust parameter.</p>
  <div id="log" class="log">Start...\n</div>
  <script>
    const VERSION = 'v2.0.0-rc.26';
    const log = document.getElementById('log');
    function add(msg){ log.textContent += msg + '\n'; }
    async function reset(){
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          add('Service-workers gevonden: ' + regs.length);
          for (const reg of regs) { await reg.unregister(); add('Service-worker verwijderd: ' + (reg.scope || '-')); }
        } else add('Geen serviceWorker API.');
      } catch(e) { add('Service-worker reset fout: ' + e.message); }
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          add('Caches gevonden: ' + keys.length);
          for (const key of keys) { await caches.delete(key); add('Cache verwijderd: ' + key); }
        } else add('Geen Cache API.');
      } catch(e) { add('Cache reset fout: ' + e.message); }
      try { sessionStorage.clear(); add('Session storage geleegd.'); } catch(e) {}
      add('Open viewer...');
      const target = new URL('index.html', location.href);
      target.searchParams.set('ogv', VERSION);
      target.searchParams.set('nocache', Date.now().toString());
      setTimeout(() => location.replace(target.toString()), 350);
    }
    reset();
  </script>
</body>
</html>
