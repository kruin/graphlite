<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Een LOG-minor vergroot de afstand tussen majors</title>
  <desc id="description">Boven staan S en O één slot uit elkaar. Onder staat een bijwoord-minor tussen S en O, waardoor hun afstand twee slots wordt.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <style>
      .card { fill:#fff; stroke:#cbd5e1; stroke-width:2; }
      .axis { stroke:#64748b; stroke-width:4; stroke-linecap:round; }
      .tick { stroke:#64748b; stroke-width:3; }
      .major { fill:#e0e7ff; stroke:#4f46e5; stroke-width:2.5; }
      .minor { fill:#dcfce7; stroke:#16a34a; stroke-width:2.5; }
      .title { fill:#0f172a; font:800 32px system-ui,-apple-system,"Segoe UI",sans-serif; }
      .subtitle { fill:#64748b; font:500 19px system-ui,-apple-system,"Segoe UI",sans-serif; }
      .section { fill:#334155; font:800 22px system-ui,-apple-system,"Segoe UI",sans-serif; }
      .node { fill:#0f172a; font:800 22px system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; dominant-baseline:middle; }
      .slot { fill:#64748b; font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; }
      .distance { fill:#4f46e5; font:800 19px system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; }
      .note { fill:#166534; font:750 19px system-ui,-apple-system,"Segoe UI",sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#page)"/>
  <text class="title" x="62" y="62">LOG bepaalt de afstand</text>
  <text class="subtitle" x="62" y="98">vaste slots · majors S/O · bijwoord als minor</text>

  <g filter="url(#shadow)">
    <rect class="card" x="52" y="132" width="1096" height="196" rx="24"/>
    <rect class="card" x="52" y="356" width="1096" height="256" rx="24"/>
  </g>

  <text class="section" x="82" y="174">Zonder minor</text>
  <line class="axis" x1="270" y1="246" x2="930" y2="246"/>
  <line class="tick" x1="410" y1="230" x2="410" y2="262"/>
  <line class="tick" x1="790" y1="230" x2="790" y2="262"/>
  <rect class="major" x="338" y="194" width="144" height="64" rx="17"/>
  <rect class="major" x="718" y="194" width="144" height="64" rx="17"/>
  <text class="node" x="410" y="226">S</text>
  <text class="node" x="790" y="226">O</text>
  <text class="slot" x="410" y="289">slot 0</text>
  <text class="slot" x="790" y="289">slot 1</text>
  <text class="distance" x="600" y="218">d(S,O) = 1</text>

  <text class="section" x="82" y="398">Minor ingevoegd: na S · vóór O</text>
  <line class="axis" x1="190" y1="508" x2="1010" y2="508"/>
  <line class="tick" x1="300" y1="492" x2="300" y2="524"/>
  <line class="tick" x1="600" y1="492" x2="600" y2="524"/>
  <line class="tick" x1="900" y1="492" x2="900" y2="524"/>
  <rect class="major" x="228" y="456" width="144" height="64" rx="17"/>
  <rect class="minor" x="510" y="448" width="180" height="72" rx="17"/>
  <rect class="major" x="828" y="456" width="144" height="64" rx="17"/>
  <text class="node" x="300" y="488">S</text>
  <text class="node" x="600" y="484">m1 · ADV</text>
  <text class="node" x="900" y="488">O</text>
  <text class="slot" x="300" y="554">slot 0</text>
  <text class="slot" x="600" y="554">slot 1</text>
  <text class="slot" x="900" y="554">slot 2</text>
  <text class="distance" x="600" y="432">d(S,O) = 2</text>
  <text class="note" x="82" y="590">De minor voegt één LOG-slot toe; dezelfde slotvolgorde wordt daarna naar LEX geprojecteerd.</text>
</svg>
