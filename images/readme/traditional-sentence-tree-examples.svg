<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Traditionele syntactische voorbeeldbomen</title>
  <desc id="description">Drie zinnen zijn als traditionele bomen getekend. De categorieën vertakken omlaag en de woorden staan op één onderste regel.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <style>
      .card { fill:#fff; stroke:#cbd5e1; stroke-width:2; }
      .branch { fill:none; stroke:#475569; stroke-width:2.4; stroke-linecap:round; }
      .node { fill:#f8fafc; stroke:#64748b; stroke-width:1.6; }
      .root { fill:#e0e7ff; stroke:#4f46e5; stroke-width:2; }
      .cat { fill:#0f172a; font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; dominant-baseline:middle; }
      .word { fill:#0f172a; font:650 20px system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; }
      .sentence { fill:#334155; font:700 20px system-ui,-apple-system,"Segoe UI",sans-serif; text-anchor:middle; }
      .sentence.compact { font-size:16px; }
      .word.compact { font-size:16px; }
      .leaf-line { stroke:#cbd5e1; stroke-width:1.5; stroke-dasharray:4 5; }
    </style>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#page)"/>
  <text x="60" y="58" fill="#0f172a" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="30" font-weight="800">Traditionele zinsbomen</text>
  <text x="60" y="90" fill="#64748b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18">takken omlaag · woorden als blaadjes op één regel</text>
  <g transform="translate(1080 42)" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 0v42"/>
    <path d="m7 30 13 13 13-13"/>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="30" y="116" width="360" height="520" rx="22"/>
    <rect class="card" x="420" y="116" width="360" height="520" rx="22"/>
    <rect class="card" x="810" y="116" width="360" height="520" rx="22"/>
  </g>

